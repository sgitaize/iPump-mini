# XcodeGen spec. Generate the project with:  cd apps/ios && xcodegen
name: OpenMinipump
options:
  bundleIdPrefix: de.sgitaize
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MiniMedKit:
    path: ../../core/MiniMedKit
targets:
  OpenMinipump:
    type: application
    platform: iOS
    sources:
      - OpenMinipump
    dependencies:
      - package: MiniMedKit
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OMP_BUNDLE_ID)
        PRODUCT_NAME: OpenMinipump
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: OpenMinipump/Info.plist
      properties:
        CFBundleDisplayName: openMinipump
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral]
        NSBluetoothAlwaysUsageDescription: "openMinipump verbindet sich per Bluetooth mit deiner MiniMed-Pumpe und liest Werte aus (nur lesend)."
        NSLocalNetworkUsageDescription: "Optional: Die lokale API kann im WLAN freigegeben werden."
    postCompileScripts:
      - name: Embed local config (.env, key database)
        script: "\"${SRCROOT}/Scripts/embed-local-config.sh\""
        basedOnDependencyAnalysis: false
