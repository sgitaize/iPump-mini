# XcodeGen spec. Generate the project with:  cd apps/ios && xcodegen
name: OpenMinipump
options:
  bundleIdPrefix: de.sgitaize
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MiniMedKit:
    path: ../../core/MiniMedKit
targets:
  OpenMinipump:
    type: application
    platform: iOS
    sources:
      - OpenMinipump
      - Shared
    dependencies:
      - package: MiniMedKit
      - target: OpenMinipumpWidgets
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OMP_BUNDLE_ID)
        PRODUCT_NAME: OpenMinipump
        CODE_SIGN_ENTITLEMENTS: $(OMP_APP_ENTITLEMENTS)
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: OpenMinipump/Info.plist
      properties:
        CFBundleDisplayName: iPump-mini
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSBluetoothAlwaysUsageDescription: "iPump-mini verbindet sich per Bluetooth mit deiner MiniMed-Pumpe und liest Werte aus (nur lesend)."
        NSLocalNetworkUsageDescription: "Optional: Die lokale API kann im WLAN freigegeben werden."
        NSSupportsLiveActivities: true
        OMPAppGroup: group.$(OMP_BUNDLE_ID)
    postCompileScripts:
      - name: Embed local config (.env, key database)
        script: "\"${SRCROOT}/Scripts/embed-local-config.sh\""
        basedOnDependencyAnalysis: false
  OpenMinipumpWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    dependencies:
      - package: MiniMedKit
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OMP_BUNDLE_ID).widgets
        CODE_SIGN_ENTITLEMENTS: $(OMP_WIDGET_ENTITLEMENTS)
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: iPump-mini
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OMPAppGroup: group.$(OMP_BUNDLE_ID)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
