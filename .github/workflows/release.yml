# Builds an IPA for AltStore/SideStore (they re-sign it with the user's Apple ID).
# Manual only; creates a DRAFT release. Nothing is published automatically.
# The SAKE key database is never part of the build: users load it in the app
# (Settings › Pump › Key database). See docs/internal/release-altstore.md.
name: Release IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.2.0)"
        required: true
      allow_any_pump:
        description: "DEV_MODE=0: accept any pump. Off = build locked (rejects every pump). Only with Simon's approval."
        type: boolean
        default: false

permissions:
  contents: write

env:
  BUNDLE_ID: de.sgitaize.openminipump

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: brew install xcodegen

      - name: Generate project
        working-directory: apps/ios
        run: xcodegen

      - name: Build (Release, unsigned)
        working-directory: apps/ios
        env:
          OMP_PUBLIC_BUILD: "1"
          OMP_PUBLIC_DEV_MODE: ${{ inputs.allow_any_pump && '0' || '1' }}
        run: |
          xcodebuild -project OpenMinipump.xcodeproj -scheme OpenMinipump -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION=${{ inputs.version }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Check bundle (no key database, no test serial)
        run: |
          APP=apps/ios/build/Build/Products/Release-iphoneos/OpenMinipump.app
          if [ -e "$APP/mobile-pump.keydb.hex" ]; then echo "key database in bundle"; exit 1; fi
          plutil -p "$APP/DevConfig.plist"
          if [ -n "$(plutil -extract TEST_PUMP_SERIAL raw "$APP/DevConfig.plist")" ]; then echo "test serial in bundle"; exit 1; fi

      - name: Ad-hoc sign with entitlements (so AltStore registers the App Group)
        run: |
          APP=apps/ios/build/Build/Products/Release-iphoneos/OpenMinipump.app
          sed "s/\$(OMP_BUNDLE_ID)/$BUNDLE_ID/" apps/ios/Widgets/Widgets.entitlements > widgets.ent
          sed "s/\$(OMP_BUNDLE_ID)/$BUNDLE_ID/" apps/ios/OpenMinipump/OpenMinipump.entitlements > app.ent
          codesign -f -s - --entitlements widgets.ent "$APP/PlugIns/OpenMinipumpWidgets.appex"
          codesign -f -s - --entitlements app.ent "$APP"
          codesign -d --entitlements :- "$APP"

      - name: Package IPA
        run: |
          mkdir -p dist/Payload
          cp -R apps/ios/build/Build/Products/Release-iphoneos/OpenMinipump.app dist/Payload/
          (cd dist && zip -qry "iPump-mini-${{ inputs.version }}.ipa" Payload)
          rm -rf dist/Payload
          ls -l dist/*.ipa

      - name: Update AltStore source (artifact)
        run: |
          IPA="dist/iPump-mini-${{ inputs.version }}.ipa"
          SIZE=$(stat -f%z "$IPA")
          URL="https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}/iPump-mini-${{ inputs.version }}.ipa"
          python3 - "$SIZE" "$URL" "${{ inputs.version }}" "${{ github.run_number }}" <<'PY'
          import json, sys, datetime
          size, url, version, build = int(sys.argv[1]), sys.argv[2], sys.argv[3], sys.argv[4]
          s = json.load(open("altstore/source.json"))
          app = s["apps"][0]
          app["versions"].insert(0, {
              "version": version,
              "buildVersion": build,
              "date": datetime.date.today().isoformat(),
              "localizedDescription": "See the release notes on GitHub.",
              "downloadURL": url,
              "size": size,
              "minOSVersion": "17.0",
          })
          json.dump(s, open("dist/source.json", "w"), indent=2, ensure_ascii=False)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: altstore
          path: dist/

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE="Draft – check before publishing."
          if [ "${{ inputs.allow_any_pump }}" != "true" ]; then NOTE="$NOTE Locked build (DEV_MODE=1): rejects every pump."; fi
          gh release create "v${{ inputs.version }}" "dist/iPump-mini-${{ inputs.version }}.ipa" dist/source.json \
            --draft --title "iPump-mini ${{ inputs.version }}" --notes "$NOTE"
